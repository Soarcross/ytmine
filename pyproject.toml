[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "ytmine"
dynamic = ["version"]
description = "Sentence-mine Mandarin from YouTube videos into Anki, in your browser."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["anki", "mandarin", "chinese", "sentence-mining", "youtube", "language-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]
dependencies = [
    "flask>=3.0",
    "yt-dlp>=2025.1.15",
    "genanki>=0.13.1",
    "jieba>=0.42.1",
    "pypinyin>=0.51.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
ytmine = "ytmine.cli:main"

[project.urls]
Homepage = "https://github.com/Soarcross/ytmine"
Issues = "https://github.com/Soarcross/ytmine/issues"

[tool.hatch.version]
path = "src/ytmine/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ytmine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
