<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ytmine</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 14px/1.4 system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; width: 380px; margin: 0; padding: 10px 12px; }
    h1 { font-size: 16px; margin: 0 0 4px; display: flex; justify-content: space-between; align-items: baseline; }
    h1 a { font-size: 12px; font-weight: 400; }
    #message { min-height: 1.4em; font-size: 13px; }
    .bad { color: #b91c1c; } .ok { color: #15803d; }
    .actions { display: flex; gap: 6px; margin: 6px 0; }
    button { font: inherit; padding: 3px 10px; cursor: pointer; }
    label.small { font-size: 12px; opacity: 0.8; display: block; margin-bottom: 4px; }
    ul { list-style: none; margin: 0; padding: 0; max-height: 380px; overflow-y: auto; }
    li { border-top: 1px solid rgba(127, 127, 127, 0.4); padding: 6px 0; }
    .zh { font-size: 17px; } .zh mark { background: none; color: #2563eb; font-weight: 600; }
    .py { font-size: 12px; opacity: 0.7; } .en { font-size: 13px; }
    .btns { display: flex; gap: 6px; margin-top: 4px; } .btns button { padding: 1px 8px; font-size: 12px; }
    form { display: flex; flex-direction: column; gap: 4px; }
    form label { font-size: 11px; opacity: 0.7; display: flex; flex-direction: column; }
    form input { font: inherit; padding: 3px 6px; }
  </style>
</head>
<body>
  <h1><span>Mined cards <span id="count">0</span></span> <span class="links"><a href="#" id="open">open ytmine</a> · <a href="#" id="options">options</a></span></h1>
  <div id="message" role="status"></div>
  <div class="actions">
    <button id="download" type="button">Download .apkg</button>
    <button id="anki" type="button">Send to Anki</button>
  </div>
  <label class="small"><input type="checkbox" id="all"> include cards already exported</label>
  <ul id="cards"></ul>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
